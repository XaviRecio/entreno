<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: la página llega hasta los bordes (Dynamic Island, barra inferior) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Color de las barras del navegador -->
  <meta name="theme-color" content="#030304">
  <!-- Al «Añadir a pantalla de inicio» se abre como una app, sin barras del navegador -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi entreno">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <!-- Empieza a conectar con Google antes de que cargue la app -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">
  <title>Mi entreno</title>
  <!-- Android: el «manifiesto» hace que, al añadirla a la pantalla de inicio, se abra como una app (sin las barras de Chrome).
       En iPhone no se pone, para no cambiar nada de lo que ya funciona allí. -->
  <script>
    (function () {
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (ios) return;
      var l = document.createElement('link');
      l.rel = 'manifest';
      l.href = 'manifest.webmanifest';
      document.head.appendChild(l);
    })();
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Fondo: negro azabache con un círculo de luz blanca en la esquina superior izquierda que «respira» (igual que el de la app) */
    :root { --fa: .24; --fk: .9;
            --fondo-app: radial-gradient(circle calc(var(--fk) * 200vw) at 0% 0%, rgba(255,255,255,var(--fa)) 0%, rgba(255,255,255,0) 100%), #030304; }
    /* --alto: en el iPhone, abierta desde la pantalla de inicio, iOS a veces da a la página menos altura que la pantalla (queda una franja abajo) y mide
       distinto según se pregunte («altura de la ventana» o «100 %»). Por eso, en ese caso, a las capas que cubren la pantalla se les da directamente la
       altura de la pantalla, que sí es un dato fiable. Si no hace falta (Safari, Android, ordenador), --alto no existe y se usa el 100 % de siempre. */
    html { height: var(--alto, 100%); }
    html, body { margin: 0; background: var(--fondo-app); overflow: hidden; overscroll-behavior: none; }
    body { height: 100%; }
    body { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           font-weight: 400; color: #ffffff; }

    /* La app ocupa TODA la pantalla (también bajo la Dynamic Island y la barra inferior); ella misma respeta esas zonas con las medidas que le mandamos */
    /* #pie: capa que queda DETRÁS de la app y solo se ve si la app no llega hasta el borde de abajo (franja que deja iOS). La app le pide color
       mientras se ve la cúpula de «Dejar la sesión aquí», para que esa franja sea del mismo color que la cúpula y no quede un bloque negro. */
    /* Las capas se pasan 1-2 px por cada lado (lo que sobra queda recortado): así, si la página queda una fracción de píxel más estrecha que la pantalla,
       no asoma por el borde una línea fina blanca. */
    #pie { position: fixed; top: 0; right: -2px; left: -1px; height: var(--alto, 100%); pointer-events: none;
           background-color: var(--pie, rgba(255, 255, 255, 0)); transition: background-color .25s ease; }
    #marco { position: fixed; top: 0; right: -2px; left: -1px; height: var(--alto, 100%); background: transparent; }
    #medida { position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
              padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #app { display: block; width: 100%; height: 100%; border: 0; background: transparent;
           opacity: 0; transition: opacity .35s ease; }
    #app.lista { opacity: 1; }
    #espera { position: fixed; top: 0; right: -2px; left: -1px; height: var(--alto, 100%); display: flex; align-items: center;
              justify-content: center; pointer-events: none; }

    #crear h1 { font-size: 24px; font-weight: 400; margin: 0; }
    #crear p { font-size: 15px; color: #b9bec8; margin: 0; line-height: 1.5; }
    #sin-enlace { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;

    #sin-enlace h1 { font-size: 22px; font-weight: 400; margin: 0; }
    #sin-enlace p { font-size: 15px; color: #b9bec8; margin: 0; line-height: 1.5; max-width: 320px; }

<body>
  <div id="medida" aria-hidden="true"></div>
  <div id="pie" aria-hidden="true"></div>
  <div id="marco">
    <iframe id="app" title="Mi entreno" hidden></iframe>

    <div id="sin-enlace" hidden>
      <h1>Falta tu enlace</h1>
      <p>Abre una vez el enlace que te ha enviado tu fisioterapeuta. A partir de ahí, la app se abrirá sola desde este icono.</p>
    </div>

    <div id="crear" hidden>
      <h1>Crear el enlace de un paciente</h1>
      <p>Pega la «URL de la aplicación web» de la hoja del paciente (la que termina en /exec) y pulsa el botón.</p>
      <textarea id="url" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      <button id="generar" type="button">Crear enlace</button>
      <div id="error" hidden></div>
      <div id="resultado" hidden></div>
      <button id="copiar" type="button" hidden>Copiar enlace</button>
    </div>
  </div>
  <div id="espera" hidden><div class="logo-carga" id="logo" role="img" aria-label="physioxavi"></div></div>

  <script>
    var T0 = performance.now();
    (function () {            // en la app de la pantalla de inicio del iPhone (en vertical): las capas miden exactamente la altura de la pantalla
      function medir() {
        var raiz = document.documentElement, alto = 0;
        if (window.navigator.standalone && window.innerHeight > window.innerWidth && screen.width && screen.height) {
          // si iOS dibuja la página reducida (p. ej. a 85 %), sus «px» son más pequeños que los de la pantalla: se convierte a px de la página
          var esc = window.innerWidth / screen.width;
          if (!(esc >= 0.5 && esc <= 2)) esc = 1;
          alto = Math.round(screen.height * esc);
        }
        if (alto > 0) raiz.style.setProperty('--alto', alto + 'px'); else raiz.style.removeProperty('--alto');
      }
      medir();
      window.addEventListener('resize', medir);
      window.addEventListener('orientationchange', function () { setTimeout(medir, 300); });
    })();
    (function () {            // fondo que respira: intensidad 24 % ± 6, radio 1,8 veces el ancho ± 0,18, ciclos de 9 s (igual que en la app)
      var raiz = document.documentElement, ultimo = 0;
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      function paso(n) {
        requestAnimationFrame(paso);
        if (n - ultimo < 33) return;
        ultimo = n;
        var f = 2 * Math.PI * (n - T0) / 9000;
        raiz.style.setProperty('--fa', ((24 + 6 * Math.sin(f)) / 100).toFixed(3));
        raiz.style.setProperty('--fk', (0.9 + 0.09 * Math.sin(f + 1.6)).toFixed(3));
      }
      requestAnimationFrame(paso);
    })();
    (function () {
      var ID_VALIDO = /^[A-Za-z0-9_-]{20,}$/;
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || '';
      // El icono de Android abre la página sin el enlace del paciente (?abrir=app): por eso guardamos su enlace la
      // primera vez que lo abre y lo recuperamos al abrir desde el icono. En iPhone el icono ya lleva el enlace completo.
      var CLAVE_ID = 'physioxavi_id_v1';
      var comoApp = params.get('abrir') === 'app' || window.navigator.standalone === true ||
                    !!(window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
      if (ID_VALIDO.test(id)) {
        try { localStorage.setItem(CLAVE_ID, id); } catch (e) {}
      } else if (comoApp) {
        try { var guardado = localStorage.getItem(CLAVE_ID) || ''; if (ID_VALIDO.test(guardado)) id = guardado; } catch (e) {}
      }

      // ---------- Con ?id=… : se muestra la app del paciente ----------
      if (ID_VALIDO.test(id)) {
        var marco = document.getElementById('app');
        var espera = document.getElementById('espera');
        var mostrada = false;
        var logo = document.getElementById('logo');
        var desde = Date.now();            // el logo se ve al menos 0,4 s para que dé tiempo a verlo
        function mostrar() {
          if (mostrada) return;
          mostrada = true;
          var espera_ms = Math.max(0, 400 - (Date.now() - desde));
          setTimeout(function () {
            logo.classList.add('saliendo');       // el logo se difumina…
            marco.classList.add('lista');         // …mientras aparece la app
            setTimeout(function () { espera.hidden = true; }, 450);
          }, espera_ms);
        }
        // La app avisa cuando ya está pintada; así no se ve la pantalla en blanco de Google
        var ventanaApp = null;
        window.addEventListener('message', function (e) {
          if (!e.data) return;
          if (e.data.physioxavi === 'hola' || e.data.physioxavi === 'lista') { ventanaApp = e.source; mandarAjustes(); }
          if (e.data.physioxavi === 'lista') mostrar();
          if (e.data.physioxavi === 'pie' && (!ventanaApp || e.source === ventanaApp)) {   // color de la franja de abajo (solo lo que manda la app)
            var c = String(e.data.c || '');
            document.documentElement.style.setProperty('--pie', /^#[0-9a-f]{6}$/i.test(c) ? c : 'rgba(255, 255, 255, 0)');
          }
        });
        // Le decimos a la app cuánto miden la Dynamic Island y la barra inferior, y a qué punto va el fondo animado (para que no haya saltos)
        function mandarAjustes() {
          if (!ventanaApp) return;
          var c = getComputedStyle(document.getElementById('medida'));
          try {
            ventanaApp.postMessage({ physioxavi: 'ajustes', t: parseFloat(c.paddingTop) || 0, r: parseFloat(c.paddingRight) || 0,
                                     b: parseFloat(c.paddingBottom) || 0, l: parseFloat(c.paddingLeft) || 0,
                                     ms: performance.now() - T0 }, '*');
          } catch (err) {}
        }
        window.addEventListener('resize', mandarAjustes);
        window.addEventListener('orientationchange', mandarAjustes);
        setTimeout(mostrar, 8000);   // por si el aviso no llega

        desde = Date.now();
        espera.hidden = false;
        marco.hidden = false;
        marco.src = 'https://script.google.com/macros/s/' + id + '/exec';
        return;
      }

      // ---------- Abierta desde el icono pero sin enlace guardado: se le pide abrir su enlace (no ve la pantalla de crear enlaces) ----------
      if (comoApp) {
        document.getElementById('sin-enlace').hidden = false;
        return;
      }

      // ---------- Sin id: pantalla para crear el enlace ----------
      var crear = document.getElementById('crear');
      var campo = document.getElementById('url');
      var error = document.getElementById('error');
      var resultado = document.getElementById('resultado');
      var copiar = document.getElementById('copiar');
      crear.hidden = false;

      document.getElementById('generar').onclick = function () {
        error.hidden = true; resultado.hidden = true; copiar.hidden = true;
        var texto = campo.value.trim();
        var m = texto.match(/\/macros\/s\/([A-Za-z0-9_-]{20,})(\/|$)/);
        var nuevoId = m ? m[1] : (ID_VALIDO.test(texto) ? texto : '');
        if (!nuevoId) {
          error.textContent = 'No reconozco esa dirección. Tiene que ser la URL de la aplicación web, que termina en /exec.';
          error.hidden = false;
          return;
        }
        resultado.textContent = window.location.origin + window.location.pathname + '?id=' + nuevoId;
        resultado.hidden = false;
        copiar.textContent = 'Copiar enlace';
        copiar.hidden = false;
      };

      copiar.onclick = function () {
        var enlace = resultado.textContent;
        function hecho() { copiar.textContent = 'Copiado'; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(enlace).then(hecho, seleccionar);
        } else { seleccionar(); }
        function seleccionar() {
          var r = document.createRange(); r.selectNodeContents(resultado);
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          copiar.textContent = 'Mantén pulsado el enlace y elige Copiar';
        }
      };
    })();
  </script>
</body>
</html>
